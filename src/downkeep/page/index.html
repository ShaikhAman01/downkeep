<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Downkeep</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div id="app" class="app plain">
    <header id="side" class="side">
      <div class="top">
        <p class="name"><img class="logo" src="/icon.svg" alt="" width="26" height="26">Downkeep</p>
        <button id="again" class="link" type="button" hidden>Check again</button>
      </div>
      <p id="tagline" class="tagline">Finds copies and unpacked zips in Downloads, and tidies the rest</p>
      <div id="sum"></div>
      <div id="tabs" class="tabs" role="tablist" aria-label="What to do" hidden>
        <button id="tab-clutter" type="button" role="tab" aria-controls="stage" aria-selected="true">Clutter</button>
        <button id="tab-tidy" type="button" role="tab" aria-controls="stage" aria-selected="false" tabindex="-1">Tidy</button>
        <button id="tab-auto" type="button" role="tab" aria-controls="stage" aria-selected="false" tabindex="-1">Automatic</button>
      </div>
    </header>
    <nav id="list" aria-label="Files"></nav>
    <main id="main">
      <div id="stage" class="stage">
        <noscript><p class="say">Downkeep needs JavaScript. It runs only on your computer.</p></noscript>
      </div>
    </main>
  </div>
  <p id="status" class="toast" role="status"></p>
</body>
</html>
