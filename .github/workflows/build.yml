name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            folder: dist/Downkeep
            name: windows
            ending: .zip
          # The oldest Ubuntu offered, so that the result also runs on older systems
          - os: ubuntu-22.04
            folder: dist/downkeep
            name: linux
            ending: .tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
          DOWNKEEP_TEST_SCHEDULE: ${{ matrix.name == 'windows' && '1' || '' }}
      - name: Install the build tools
        run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements.txt"
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/downkeep.spec
      - name: Check which glibc it needs
        if: matrix.name == 'linux'
        run: python packaging/glibc.py "${{ matrix.folder }}" --at-most 2.35
      - name: Pack
        run: python packaging/bundle.py "${{ matrix.folder }}" out
      - name: Try the download
        run: |
          version="$(python -c 'import sys; sys.path.insert(0, "src"); import downkeep; print(downkeep.__version__)')"
          python packaging/smoke.py out/*"${{ matrix.ending }}" --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downkeep-${{ matrix.name }}
          path: out/
          if-no-files-found: error
